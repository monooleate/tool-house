[build]
  command = "npm run build:hu"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PUBLIC_SITE_LANG = "hu"
  PUBLIC_SITE_URL = "https://konvertalo.hu"
  # Publikus AdSense publisher ID (ugyanaz a fiók mint RO; lásd public/ads.txt)
  PUBLIC_ADSENSE_CLIENT_ID = "ca-pub-9658786113006303"

[[redirects]]
  from = "/jpg-to-webp"
  to = "/kep/jpg-webp/"
  status = 301

[[redirects]]
  from = "/csv-to-json"
  to = "/adat/csv-json/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  command = "npm run dev"
  port = 4321
  autoLaunch = false

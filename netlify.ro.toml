[build]
  command = "pnpm build:ro"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  PUBLIC_SITE_LANG = "ro"
  PUBLIC_SITE_URL = "https://instrumenteonline.ro"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

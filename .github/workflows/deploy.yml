# .github/workflows/deploy.yml
# Minden main branch push után mindkét site újra deployol

name: Deploy All Sites

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-hu:
    name: Deploy konvertalo.hu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:hu
        env:
          SITE_LANG: hu
          PUBLIC_SITE_URL: https://konvertalo.hu
          # Publikus AdSense publisher ID (ugyanaz a fiók mint RO; lásd public/ads.txt).
          # Build-időbe égetve → BaseLayout betölti az adsbygoogle scriptet, AdSlot renderel.
          PUBLIC_ADSENSE_CLIENT_ID: ca-pub-9658786113006303
      - uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=dist --site=${{ secrets.NETLIFY_SITE_ID_HU }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

  deploy-ro:
    name: Deploy instrumenteonline.ro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:ro
        env:
          SITE_LANG: ro
          PUBLIC_SITE_URL: https://instrumenteonline.ro
          # Publikus AdSense publisher ID (lásd public/ads.txt). Eddig csak Netlify UI-ban
          # volt → most committed config, hogy ne tűnjön el egy Actions-deploynál.
          PUBLIC_ADSENSE_CLIENT_ID: ca-pub-9658786113006303
      - uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=dist --site=${{ secrets.NETLIFY_SITE_ID_RO }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

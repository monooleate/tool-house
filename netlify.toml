[build]
  command       = "npm run build"
  publish       = "dist"

[build.environment]
  NODE_VERSION  = "20"
  # Publikus AdSense publisher ID (lásd public/ads.txt).
  # FONTOS: konvertalo.hu EZT a configot olvassa (a netlify.hu.toml nem aktív rá),
  # ezért a HU reklámhoz ide kell a publisher ID. RO a saját configját/env-jét használja.
  PUBLIC_ADSENSE_CLIENT_ID = "ca-pub-9658786113006303"
  # Saját (house-ad) hirdetési réteg FŐKAPCSOLÓJA (SSOT: src/config/house-ads.json,
  # doksi: HOUSE-ADS.md). Csak "true" kapcsolja BE. Ez a HU (konvertalo.hu) kapcsolója.
  # AdSense-től FÜGGETLEN. Bekapcsoláshoz: állítsd "true"-ra és pushold.
  PUBLIC_HOUSE_ADS_ENABLED = "false"

# ─── Cross-domain Language Redirects ────────────────────────
# Fixes GSC 404 errors: wrong-language URLs on wrong domain.
# Netlify 301s don't override existing static files,
# so both directions are safe in the shared netlify.toml.

# ── RO category paths on HU site → instrumenteonline.ro ─────
[[redirects]]
  from   = "/imagine/*"
  to     = "https://instrumenteonline.ro/imagine/:splat"
  status = 301

[[redirects]]
  from   = "/date/*"
  to     = "https://instrumenteonline.ro/date/:splat"
  status = 301

[[redirects]]
  from   = "/text/*"
  to     = "https://instrumenteonline.ro/text/:splat"
  status = 301

[[redirects]]
  from   = "/dezvoltator/*"
  to     = "https://instrumenteonline.ro/dezvoltator/:splat"
  status = 301

[[redirects]]
  from   = "/fisiere/*"
  to     = "https://instrumenteonline.ro/fisiere/:splat"
  status = 301

